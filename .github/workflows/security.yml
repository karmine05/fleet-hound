name: security

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/security.yml'
  push:
    branches:
      - main
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/security.yml'
  schedule:
    # Weekly Monday 14:00 UTC: catches advisories published against pinned
    # module versions and the Go stdlib even when go.mod hasn't changed.
    - cron: '0 14 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (reachable CVEs in modules + stdlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No GITHUB_TOKEN left in .git/config for later steps to read.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.10'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Scan
        # Fails on any vulnerability reachable from this module's code.
        run: govulncheck ./...
