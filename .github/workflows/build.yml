name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: compile, shellcheck, image build + scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Byte-compile Python
        run: python -m compileall -q src webviz main.py categorize_software.py clear_db.py

      - name: Extension scorer self-check
        run: python src/extension_intel.py

      - name: ShellCheck
        # Pinned image tag, not a third-party action.
        run: >
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0
          -S warning start.sh stop.sh scripts/ensure_memgraph_user.sh

      - name: Build image
        run: docker build -t fleet-hound-webviz:ci .

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        # Unfixed OS findings have no upstream package yet; failing on them
        # would block every build without a remedy.
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.69.3 image --quiet --scanners vuln
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          fleet-hound-webviz:ci
