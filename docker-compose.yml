name: fleet-hound

services:
  # Memgraph Database
  memgraph:
    image: memgraph/memgraph:latest
    container_name: fleet-memgraph
    ports:
      - "7687:7687" # Bolt protocol
      - "7444:7444" # Monitoring
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
      - ./config/memgraph.conf:/etc/memgraph/memgraph.conf:ro
    # command: handled by config file
    networks:
      - fleet-network
    healthcheck:
      test: [ "CMD-SHELL", "echo 'RETURN 1;' | /usr/bin/mgconsole --host 127.0.0.1 --port 7687 --use-ssl=false || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Fleet-Bloodhound Web Dashboard
  webviz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-webviz
    # Bind the dashboard to the loopback interface by default so a fresh install
    # is not LAN-reachable. Operators expose it via a reverse proxy (nginx /
    # traefik) terminating TLS + auth, or override this mapping after setting
    # WEBVIZ_API_TOKEN.
    ports:
      - "127.0.0.1:8080:8080"
    # Container hardening — non-root user (Dockerfile), cap drops, read-only
    # rootfs with explicit tmpfs for /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Pulls non-secret defaults from .env. Secrets (FLEET_API_TOKEN,
    # WEBVIZ_API_TOKEN, MEMGRAPH_PASSWORD) should live in .env (chmod 600)
    # or be supplied via *_FILE references to mounted secret files.
    env_file:
      - .env
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - PORT=8080
      # Optional Bolt auth — passes through from host env / .env file.
      - MEMGRAPH_USER
      - MEMGRAPH_PASSWORD
      - MEMGRAPH_PASSWORD_FILE
      # Optional API token for /api/* routes.
      - WEBVIZ_API_TOKEN
      - WEBVIZ_API_TOKEN_FILE
      - WEBVIZ_REQUIRE_AUTH
      - WEBVIZ_ALLOW_ANONYMOUS_READ
      - WEBVIZ_DEBUG_ERRORS
      # Wikidata enricher — autonomous Orient-phase categorizer.
      - ENRICHER_ENABLED
      - ENRICHER_INTERVAL_SEC
      - ENRICHER_BATCH_SIZE
      # Shadow IT outlier threshold (fraction of platform hosts; default 0.03).
      # Drives /api/shadow-it detection AND enrichment-candidate selection.
      - SHADOW_IT_OUTLIER_PCT
      # OODA supervisor — autonomous Observe→Orient→Decide→Act cycles.
      # Requires FLEET_URL + FLEET_API_TOKEN (or FLEET_EMAIL/FLEET_PASSWORD).
      - OODA_ENABLED
      - OODA_INTERVAL_SEC
      - OODA_FULL_SCAN_EVERY
      - OODA_TEAMS
      # Snapshot retention — how far back the drift/changelog diff can reach.
      # SNAPSHOT_RETAIN_DAYS is the primary control (age horizon, default 30);
      # SNAPSHOT_RETAIN_MAX is a disk-bound file-count safety valve (default 5000).
      - SNAPSHOT_RETAIN_DAYS
      - SNAPSHOT_RETAIN_MAX
      - FLEET_URL
      - FLEET_API_TOKEN
      - FLEET_EMAIL
      - FLEET_PASSWORD
      - INSECURE
    volumes:
      - ./config:/app/config
    depends_on:
      memgraph:
        condition: service_healthy
    networks:
      - fleet-network
    restart: unless-stopped

networks:
  fleet-network:
    driver: bridge

volumes:
  memgraph-data:
  memgraph-log:


