name: fleet-hound

services:
  # Memgraph Database
  memgraph:
    # Pin the exact release the data volume was created with. `:latest` can
    # jump a major version on a recreate and break Bolt clients / on-disk
    # snapshots without warning; a major *downgrade* (e.g. 2.x engine over 3.x
    # data) fails to start the database at all. Verify with `SHOW VERSION`.
    image: memgraph/memgraph:3.14.0
    # Memory cap lives in config/memgraph.conf (`--memory-limit=8192`). Do not
    # set `command:` here: a Compose command replaces the image argv and
    # causes Memgraph to ignore the conf (WAL, snapshots, query timeout).
    container_name: fleet-memgraph
    ports:
      - "127.0.0.1:7687:7687" # Bolt protocol (loopback; webviz talks over the compose network)
      - "127.0.0.1:7444:7444" # Monitoring
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
      - ./config/memgraph.conf:/etc/memgraph/memgraph.conf:ro
    environment:
      - MEMGRAPH_USER
      - MEMGRAPH_PASSWORD
    networks:
      - fleet-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$MEMGRAPH_USER\" ] && [ -n \"$$MEMGRAPH_PASSWORD\" ]; then echo 'RETURN 1;' | /usr/bin/mgconsole --host 127.0.0.1 --port 7687 --use-ssl=false --username=\"$$MEMGRAPH_USER\" --password=\"$$MEMGRAPH_PASSWORD\" || echo 'RETURN 1;' | /usr/bin/mgconsole --host 127.0.0.1 --port 7687 --use-ssl=false; else echo 'RETURN 1;' | /usr/bin/mgconsole --host 127.0.0.1 --port 7687 --use-ssl=false; fi || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 10G
        reservations:
          cpus: "1.0"
          memory: 4G

  # Fleet-Bloodhound Web Dashboard
  webviz:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fleet-webviz
    # Bind the dashboard to the loopback interface by default so a fresh install
    # is not LAN-reachable. Operators expose it via a reverse proxy (nginx /
    # traefik) terminating TLS + auth, or override this mapping after setting
    # WEBVIZ_API_TOKEN.
    ports:
      - "127.0.0.1:8080:8080"
    # Container hardening — non-root user (Dockerfile), cap drops, read-only
    # rootfs with explicit tmpfs for /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Pulls non-secret defaults from .env. Secrets (FLEET_API_TOKEN,
    # WEBVIZ_API_TOKEN, MEMGRAPH_PASSWORD) should live in .env (chmod 600)
    # or be supplied via *_FILE references to mounted secret files.
    env_file:
      - .env
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - PORT=8080
      # The rootfs is read-only; ETL/ OODA watermarks live on the config mount.
      # `docker compose exec webviz python main.py` inherits this.
      - STATE_FILE=/app/config/.state.json
      # Optional Bolt auth — passes through from host env / .env file.
      - MEMGRAPH_USER
      - MEMGRAPH_PASSWORD
      - MEMGRAPH_PASSWORD_FILE
      # Optional API token for /api/* routes.
      - WEBVIZ_API_TOKEN
      - WEBVIZ_API_TOKEN_FILE
      - WEBVIZ_REQUIRE_AUTH
      - WEBVIZ_ALLOW_ANONYMOUS_READ
      - WEBVIZ_DEBUG_ERRORS
      # Wikidata enricher — autonomous Orient-phase categorizer.
      - ENRICHER_ENABLED
      - ENRICHER_INTERVAL_SEC
      - ENRICHER_BATCH_SIZE
      - ENRICHER_PARALLELISM
      # Browser-extension intel worker — anonymous store metadata + risk scores.
      # Defaults: enabled, 6h interval, 50 extensions/cycle, cache under /app/config.
      - EXTENSION_WORKER_ENABLED
      - EXTENSION_WORKER_INTERVAL_SEC
      - EXTENSION_WORKER_BATCH_SIZE
      - EXTENSION_WORKER_PARALLELISM
      - EXTENSION_CACHE_DIR
      # Shadow IT outlier threshold (fraction of platform hosts; default 0.03).
      # Drives /api/shadow-it detection AND enrichment-candidate selection.
      - SHADOW_IT_OUTLIER_PCT
      # Include Linux distro packages (deb/rpm) in Shadow IT detection.
      # Default OFF — osquery can't tell a deliberate install from a transitive
      # dep, so this bucket is noisy. Set true/1/yes/on to opt in.
      - SHADOW_IT_INCLUDE_LINUX_PACKAGES
      # OODA supervisor — autonomous Observe→Orient→Decide→Act cycles.
      # Requires FLEET_URL + FLEET_API_TOKEN (or FLEET_EMAIL/FLEET_PASSWORD).
      - OODA_ENABLED
      - OODA_INTERVAL_SEC
      - OODA_FULL_SCAN_EVERY
      - OODA_TEAMS
      # Snapshot retention — how far back the drift/changelog diff can reach.
      # SNAPSHOT_RETAIN_DAYS is the primary control (age horizon, default 30);
      # SNAPSHOT_RETAIN_MAX is a disk-bound file-count safety valve (default 5000).
      - SNAPSHOT_RETAIN_DAYS
      - SNAPSHOT_RETAIN_MAX
      - FLEET_URL
      - FLEET_API_TOKEN
      - FLEET_EMAIL
      - FLEET_PASSWORD
      - INSECURE
    volumes:
      - ./config:/app/config
    depends_on:
      memgraph:
        condition: service_healthy
    networks:
      - fleet-network
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5); sys.exit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

networks:
  fleet-network:
    driver: bridge

volumes:
  memgraph-data:
  memgraph-log:


